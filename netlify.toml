# Netlify build for the Next.js app in web/.
[build]
  base = "web"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime (OpenNext adapter). Without it Netlify publishes .next as static files and every page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
